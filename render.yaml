services:
  - type: web
    name: warehouse-iq
    runtime: python
    buildCommand: >-
      python -m pip install -r requirements.txt -c deployment/linux-constraints.txt
      && python -m pip check
      && python verify_public_stage.py --stage .render-preview
    startCommand: python .render-preview/run_dashboard.py render
    healthCheckPath: /_stcore/health
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: WIQ_RELEASE_MODE
        value: public
